<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AI Universe — карта нейросервисов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060814;
    --panel: rgba(14,17,28,0.62);
    --panel-border: rgba(255,255,255,0.10);
    --text: #e7eaf5;
    --text-dim: #8b92ab;
    --accent: #4D8BFF;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 15% 20%, rgba(77, 139, 255, 0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(232, 121, 249, 0.06), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(0, 229, 188, 0.04), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }
  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  .mono{ font-family:'JetBrains Mono', monospace; }

  header#topbar{
    position:fixed; top:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    padding: 16px 16px 0;
    pointer-events:none;
    z-index: 20;
  }
  #title{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
    pointer-events:none;
    font-family:'JetBrains Mono', monospace;
  }
  #title b{ color:var(--text); font-weight:500; }

  #search-wrap{
    position:relative;
    width: min(420px, 88vw);
    pointer-events:auto;
  }
  #search{
    width:100%;
    padding: 11px 16px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    color: var(--text);
    font-size: 14px;
    font-family: 'Space Grotesk', sans-serif;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #search::placeholder{ color: var(--text-dim); }
  #search:focus{ 
    border-color: rgba(77,139,255,0.55); 
    box-shadow: 0 0 0 4px rgba(77,139,255,0.1);
  }

  #suggestions{
    position:absolute; left:0; right:0; top: calc(100% + 8px);
    background: rgba(10,12,20,0.88);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    overflow:hidden;
    display:none;
    max-height: 260px;
    overflow-y:auto;
  }
  #suggestions.show{ display:block; }
  .sugg-item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 14px;
    font-size: 13px;
    cursor:pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .sugg-item:last-child{ border-bottom:none; }
  .sugg-item:hover{ background: rgba(255,255,255,0.06); }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow: 0 0 6px currentColor; }
  .sugg-name{ color:var(--text); }
  .sugg-cat{ color:var(--text-dim); font-size:11px; margin-left:auto; font-family:'JetBrains Mono', monospace; }

  aside#legend{
    position:fixed; left:16px; bottom:16px;
    display:flex; flex-direction:column; gap:6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px;
    backdrop-filter: blur(14px);
    z-index: 20;
    max-width: 168px;
  }
  .legend-item{
    display:flex; align-items:center; gap:8px;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor:pointer;
    padding: 3px 4px;
    border-radius: 8px;
    user-select:none;
    transition: background .15s ease, color .15s ease;
  }
  .legend-item:hover{ background: rgba(255,255,255,0.06); color:var(--text); }
  .legend-item.active{ color: var(--text); background: rgba(255,255,255,0.08); }
  .legend-swatch{ width:9px; height:9px; border-radius:50%; flex:none; box-shadow: 0 0 8px currentColor; }
  .legend-count{ margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:10px; opacity:0.7; }

  #reset-view-btn {
    position: fixed;
    top: 80px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 20;
    transition: all .2s ease;
  }
  #reset-view-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); transform: rotate(180deg); }

  #hint{
    position:fixed; right:16px; bottom:16px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    text-align:right;
    line-height:1.6;
    z-index:20;
    pointer-events:none;
    opacity:0.75;
  }

  #label-layer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index: 6;
    overflow:hidden;
  }
  .star-label{
    position:absolute; top:0; left:0;
    white-space:nowrap;
    font-family:'JetBrains Mono', monospace;
    font-weight:300;
    letter-spacing:0.015em;
    color: rgba(220,226,245,0.5);
    text-shadow: 0 0 5px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.6);
    will-change: transform, opacity;
    transition: color .15s ease;
    opacity:0;
  }
  .star-label .lbl-cat{
    display:none;
    margin-left:7px;
    font-size:0.82em;
    color: rgba(160,170,200,0.85);
  }
  .star-label.active{
    color:#ffffff;
    font-weight:500;
    z-index:1;
    text-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 2px rgba(0,0,0,0.9);
  }
  .star-label.active .lbl-cat{ display:inline; }

  aside#panel{
    position:fixed; top:0; right:0; height:100%;
    width: 320px; max-width: 86vw;
    background: rgba(9,11,19,0.78);
    border-left: 1px solid var(--panel-border);
    backdrop-filter: blur(18px);
    transform: translateX(100%);
    transition: transform .38s cubic-bezier(.2,.8,.2,1);
    z-index: 25;
    padding: 26px 22px;
    overflow-y:auto;
  }
  aside#panel.show{ transform: translateX(0); }
  #panel-close{
    position:absolute; top:18px; right:18px;
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.04);
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    transition: color .15s, background .15s;
  }
  #panel-close:hover{ color:var(--text); background:rgba(255,255,255,0.1); }
  #panel-cat-badge{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-top: 34px;
  }
  #panel-cat-badge .legend-swatch{ width:8px; height:8px; }
  #panel-name{
    font-size: 26px;
    font-weight:600;
    margin: 10px 0 18px;
    line-height:1.15;
  }
  .panel-section-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }

  .tag-chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    background: rgba(255,255,255,0.02);
    animation: tagPop .3s ease-out backwards;
  }
  @keyframes tagPop { 
    from { opacity: 0; transform: translateY(4px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  #panel-pop-bar{
    height:5px; border-radius:4px; background: rgba(255,255,255,0.08);
    overflow:hidden; margin-top:6px;
  }
  #panel-pop-fill{ height:100%; border-radius:4px; transition: width .4s ease; }
  #panel-neighbors{ display:flex; flex-direction:column; gap:5px; }
  .neighbor-item{
    display:flex; align-items:center; gap:8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor:pointer;
    padding: 6px 8px;
    border-radius:8px;
    transition: background .15s, color .15s;
  }
  .neighbor-item:hover{ background: rgba(255,255,255,0.06); color:var(--text); }

  #loading{
    position:fixed; inset:0; background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    z-index: 100;
    transition: opacity .5s ease;
  }
  #loading .ring{
    width:34px; height:34px; border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  #loading .label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (max-width: 640px){
    aside#legend{ display:none; }
    #hint{ display:none; }
    aside#panel{ width: 100%; }
    #reset-view-btn{ top: 70px; right: 10px; }
  }
</style>
</head>

const DATA = RAW.map(([name, category, tags, popularity], i) => ({
  id: i, name, category, tags, popularity,
}));

/* ============================================================
   2. ГЕНЕРАЦИЯ ПОЗИЦИЙ
   ============================================================ */

const FILL_R = 155;                
const SPHERE_R = FILL_R + 10;       

function seededRandom(seed){
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
const rand = seededRandom(1337);

function fibonacciDirs(n){
  const dirs = [];
  const golden = Math.PI * (1 + Math.sqrt(5));
  for(let i=0;i<n;i++){
    const phi = Math.acos(1 - 2*(i+0.5)/n);
    const theta = golden * (i+0.5);
    dirs.push(new THREE.Vector3(
      Math.sin(phi)*Math.cos(theta),
      Math.sin(phi)*Math.sin(theta),
      Math.cos(phi)
    ));
  }
  return dirs;
}

function randomInBall(R){
  const r = R * Math.cbrt(rand());
  const theta = rand()*Math.PI*2;
  const phi = Math.acos(2*rand()-1);
  return new THREE.Vector3(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.sin(phi)*Math.sin(theta),
    r*Math.cos(phi)
  );
}

const catKeys = Object.keys(CATEGORIES);

function categoryCrossScore(cat){
  let score = 0;
  DATA.forEach(a=>{
    if(a.category !== cat) return;
    DATA.forEach(b=>{
      if(b.category === cat) return;
      score += a.tags.filter(t=>b.tags.includes(t)).length;
    });
  });
  return score;
}

const crossScores = {};
catKeys.forEach(k=> crossScores[k] = categoryCrossScore(k));
const rankedCats = [...catKeys].sort((a,b)=> crossScores[b]-crossScores[a]);

const R_MIN = 25, R_MAX = 140; 
const catRadius = {};
rankedCats.forEach((k,i)=>{
  const t = rankedCats.length>1 ? i/(rankedCats.length-1) : 0;
  catRadius[k] = R_MIN + (R_MAX-R_MIN)*t;
});

const catDirs = {};
fibonacciDirs(catKeys.length).forEach((d,i)=> catDirs[catKeys[i]] = d);

function generatePositions(data){
  const pos = data.map((d)=>{
    const center = catDirs[d.category].clone().multiplyScalar(catRadius[d.category]);
    const spread = 40 + catRadius[d.category]*0.6;
    return center.add(randomInBall(spread));
  });

  const n = data.length;
  const targets = new Array(n).fill(null);
  for(let i=0;i<n;i++){
    let wSum = 0;
    const acc = new THREE.Vector3();
    for(let j=0;j<n;j++){
      if(j===i || data[j].category===data[i].category) continue;
      const shared = data[i].tags.filter(t=>data[j].tags.includes(t)).length;
      if(shared<=0) continue;
      acc.addScaledVector(pos[j], shared);
      wSum += shared;
    }
    if(wSum>0){ acc.multiplyScalar(1/wSum); targets[i] = acc; }
  }
  const bridgeCoeff = 0.14;
  for(let i=0;i<n;i++){
    if(targets[i]) pos[i].lerp(targets[i], bridgeCoeff);
  }

  const minDistSame = 10.0, minDistCross = 16.0;
  for(let iter=0; iter<46; iter++){
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const a = pos[i], b = pos[j];
        const minDist = (data[i].category===data[j].category) ? minDistSame : minDistCross;
        const d = a.distanceTo(b);
        if(d < minDist && d > 0.0001){
          const push = (minDist - d) * 0.5;
          const dir = a.clone().sub(b).normalize().multiplyScalar(push);
          a.add(dir);
          b.sub(dir);
        }
      }
    }
  }

  pos.forEach(p=>{
    const r = p.length();
    if(r > FILL_R) p.multiplyScalar(FILL_R/r);
  });

  return pos;
}

const positions = generatePositions(DATA);
DATA.forEach((d,i)=>{ d.pos = positions[i]; });

function buildNeighbors(data, k=5){
  data.forEach((d,i)=>{
    const scored = data
      .filter(o=>o.id!==d.id)
      .map(o=>{
        let score = (o.category===d.category) ? 4 : 0;
        score += d.tags.filter(t=>o.tags.includes(t)).length * 3;
        return { o, score, dist: d.pos.distanceTo(o.pos) };
      })
      .sort((a,b)=> (b.score-a.score) || (a.dist-b.dist))
      .slice(0,k);
    d.neighbors = scored.map(x=>x.o.id);
  });
}

  attribute float size;
  attribute float dim;
  attribute vec3 color;
  attribute float twinklePhase;
  attribute float twinkleSpeed;
  varying vec3 vColor;
  varying float vDim;
  varying float vTwinkle;
  uniform float uScale;
  uniform float uTime;
  void main(){
    vColor = color;
    vDim = dim;
    vTwinkle = 0.78 + 0.22 * sin(uTime * twinkleSpeed + twinklePhase);
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * uScale * (350.0 / -mvPosition.z);

  uniform sampler2D pointTexture;
  varying vec3 vColor;
  varying float vDim;
  varying float vTwinkle;
  void main(){
    vec4 tex = texture2D(pointTexture, gl_PointCoord);
    float a = tex.a * (0.35 + 0.65*vDim) * vTwinkle;
    vec3 finalColor = vColor * (0.8 + 0.5*vDim) + vec3(0.5,0.55,0.6)*tex.r*0.6;
    gl_FragColor = vec4(finalColor, a);
  }
`;

  uniform sampler2D pointTexture;
  varying vec3 vColor;
  varying float vDim;
  varying float vTwinkle;
  void main(){
    vec4 tex = texture2D(pointTexture, gl_PointCoord);
    float a = tex.a * 0.55 * vDim * vTwinkle;

`;

function buildConstellationEdges(data, k=2){
  const edges = [];
  const seen = new Set();
  data.forEach((d,i)=>{
    data
      .map((o,j)=>({ j, dist: d.pos.distanceTo(o.pos) }))
      .filter(x=> x.j!==i && data[x.j].category===d.category)
      .sort((a,b)=>a.dist-b.dist)
      .slice(0,k)
      .forEach(c=>{
        const key = i<c.j ? i+"_"+c.j : c.j+"_"+i;
        if(!seen.has(key)){ seen.add(key); edges.push([i, c.j]); }
      });
  });
  return edges;
}

const raySprite = new THREE.Vector3();
function projectToScreen(v3, out){
  raySprite.copy(v3).applyMatrix4(universe.matrixWorld).project(camera);
  out.x = (raySprite.x*0.5+0.5) * renderer.domElement.clientWidth;
  out.y = (-raySprite.y*0.5+0.5) * renderer.domElement.clientHeight;
  return raySprite.z < 1; 
}

const screenPts = DATA.map(()=>({x:0,y:0}));
const frontFlags = new Uint8Array(N);
const mouse = { x:-9999, y:-9999 };
let pointerDown = false, pointerMoved = false;

function pickNearest(px, py){
  let best = -1, bestDist = 1e9;
  for(let i=0;i<N;i++){
    const inFront = projectToScreen(DATA[i].pos, screenPts[i]);
    frontFlags[i] = inFront ? 1 : 0;
    if(!inFront) continue;
    const dx = screenPts[i].x - px, dy = screenPts[i].y - py;
    const dist = dx*dx+dy*dy;
    const r = (sizeArr[i]*1.4 + 6);
    if(dist < r*r && dist < bestDist){ bestDist = dist; best = i; }
  }
  return best;
}

renderer.domElement.addEventListener("pointerdown", ()=>{ pointerDown=true; pointerMoved=false; });
renderer.domElement.addEventListener("pointermove", (e)=>{
  if(pointerDown) pointerMoved = true;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
renderer.domElement.addEventListener("pointerup", (e)=>{
  pointerDown = false;
  if(pointerMoved) return; 
  const idx = pickNearest(e.clientX, e.clientY);
  if(idx >= 0){ selectStar(idx, false); }
  else { deselect(); }
});
renderer.domElement.addEventListener("pointerleave", ()=>{ mouse.x=-9999; mouse.y=-9999; hoveredIdx=-1; });

function updateHover(){
  const idx = pickNearest(mouse.x, mouse.y);
  if(idx !== hoveredIdx){
    hoveredIdx = idx;
    renderer.domElement.style.cursor = idx>=0 ? "pointer" : "grab";
  }
}

const distScratch = new THREE.Vector3();
function updateLabels(){
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const focusRadius = Math.min(window.innerWidth, window.innerHeight) * 0.08;
  let centerIdx = -1, bestD2 = focusRadius*focusRadius;
  for(let i=0;i<N;i++){
    if(!frontFlags[i]) continue;
    const dx = screenPts[i].x - cx, dy = screenPts[i].y - cy;
    const d2 = dx*dx + dy*dy;
    if(d2 < bestD2){ bestD2 = d2; centerIdx = i; }
  }

  for(let i=0;i<N;i++){
    const el = starLabels[i];
    if(!frontFlags[i]){ el.style.opacity = 0; continue; }

    distScratch.copy(DATA[i].pos).applyMatrix4(universe.matrixWorld);
    const camDist = camera.position.distanceTo(distScratch);
    const fade = THREE.MathUtils.clamp((450 - camDist) / 350, 0.16, 1);

    const isActive = (i === hoveredIdx || i === selectedIdx || i === centerIdx);
    el.classList.toggle("active", isActive);

    const opacity = isActive ? 1 : fade * dimArr[i] * 0.82;
    el.style.opacity = opacity.toFixed(2);
    el.style.transform = `translate(${(screenPts[i].x+8).toFixed(1)}px, ${(screenPts[i].y-6).toFixed(1)}px)`;
  }
}

function flyTo(idx){
  const target = DATA[idx].pos.clone();
  const dir = target.clone().normalize();
  const camTarget = target.clone().add(dir.clone().multiplyScalar(35));
  flying = {
    t: 0, dur: 1.15,
    fromPos: camera.position.clone(),
    toPos: camTarget,
    fromTarget: controls.target.clone(),
    toTarget: target,
  };
}

function resetCamera() {
  flying = {
    t: 0, dur: 1.2,
    fromPos: camera.position.clone(),
    toPos: INITIAL_CAM_POS.clone(),
    fromTarget: controls.target.clone(),
    toTarget: new THREE.Vector3(0,0,0)
  };
  deselect();
}

document.getElementById('reset-view-btn').addEventListener('click', resetCamera);

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function updateFlight(dt){
  if(!flying) return;
  flying.t += dt;
  const k = Math.min(flying.t/flying.dur, 1);
  const e = easeInOutCubic(k);
  camera.position.lerpVectors(flying.fromPos, flying.toPos, e);
  controls.target.lerpVectors(flying.fromTarget, flying.toTarget, e);
  if(k>=1) flying = null;
}

teslaGroup.add(hood);

// Салон (открытый, черный)
const interior = new THREE.Mesh(new THREE.BoxGeometry(7, 1, 6), matBlack);
interior.position.set(0, 3.5, -1);
teslaGroup.add(interior);

// Лобовое стекло (наклонное, голубое)
const windshieldGeo = new THREE.BoxGeometry(7, 3, 0.5);
const windshield = new THREE.Mesh(windshieldGeo, matGlass);
windshield.position.set(0, 4.5, 3);
windshield.rotation.x = -0.4; // Наклон
teslaGroup.add(windshield);

// Колеса
const wheelGeo = new THREE.CylinderGeometry(2.5, 2.5, 2, 16);
const wheelPositions = [
  [-5, 1, 6], [5, 1, 6],
  [-5, 1, -6], [5, 1, -6]
];
wheelPositions.forEach(pos => {
  const wheel = new THREE.Mesh(wheelGeo, matBlack);
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(pos[0], pos[1], pos[2]);
  teslaGroup.add(wheel);
});

// Маячок (стоп-сигнал) - крупный, на самом краю багажника
const beacon = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), matBeacon);
beacon.position.set(0, 4, -10);
teslaGroup.add(beacon);

const beaconLight = new THREE.PointLight(0xff0000, 5, 30);
beaconLight.position.set(0, 4, -10);
teslaGroup.add(beaconLight);

// Уменьшенный масштаб
teslaGroup.scale.set(0.2, 0.2, 0.2);

const teslaStartPos = new THREE.Vector3(-90, -90, -180);
const teslaEndPos = new THREE.Vector3(90, 90, -180);

teslaGroup.position.copy(teslaStartPos);
const lookTarget = teslaStartPos.clone().add(new THREE.Vector3(1, 1, 0).normalize());
teslaGroup.lookAt(lookTarget);
teslaGroup.rotateY(Math.PI); 

camera.add(teslaGroup);
scene.add(camera);

/* ============================================================
   8. RESIZE / АНИМАЦИЯ
   ============================================================ */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let idleTimer = 0;
controls.addEventListener("change", ()=>{ idleTimer = 0; });

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();
  haloMat.uniforms.uTime.value = elapsed;
  coreMat.uniforms.uTime.value = elapsed;

  updateFlight(dt);
  controls.update();
  updateHover();
  updateLabels();

  idleTimer += dt;
  if(idleTimer > 2.2 && !flying){
    universe.rotation.y += dt * 0.018;
  }
  bgStars.rotation.y += dt * 0.004;

  const teslaSpeed = 0.02;
  let t = (elapsed * teslaSpeed) % 1; 
  teslaGroup.position.lerpVectors(teslaStartPos, teslaEndPos, t);
  
  const camDist = camera.position.distanceTo(controls.target);
  teslaGroup.visible = camDist > 200; 
  
  let visibility = 1.0;
  if (t < 0.1) visibility = t / 0.1;
  if (t > 0.9) visibility = (1 - t) / 0.1;
  
  if (teslaGroup.visible) {
    teslaGroup.traverse(obj => {
      if (obj.material) {
        let base = 1.0;
        if (obj.material === matGlass) base = 0.6;
        if (obj.material === matBeacon) base = 1.0;
        obj.material.opacity = visibility * base;
      }
    });
    // Жесткое мигание маячка: либо горит, либо выключен
    const blink = Math.sin(elapsed * 6) > 0;
    matBeacon.opacity = blink ? visibility : 0.0;
    beaconLight.intensity = blink ? 5.0 : 0.0;
  }

  renderer.render(scene, camera);
}

window.addEventListener("load", ()=>{
  const loading = document.getElementById("loading");
  loading.style.opacity = "0";
  setTimeout(()=> loading.remove(), 550);
});
applyFilter();
animate();
</script>
</body>
</html>
